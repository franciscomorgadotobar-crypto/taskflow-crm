name: Validar sintaxis del CRM

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: Validar módulos JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis de todos los módulos
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done < <(find js -type f -name '*.js' -print0)
          node --check service-worker.js
          node --check config.js
