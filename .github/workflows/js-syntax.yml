name: Validar sintaxis del CRM

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: Validar módulos JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis de todos los módulos
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check --input-type=module < "$file"
          done < <(find js -type f -name '*.js' -print0)
          node --check service-worker.js
          node --check config.js
      - name: Probar exportación de listas de precios
        run: node .github/price-list-export.test.mjs
      - name: Probar tasa UF y USD, fuentes y formato chileno
        run: node .github/quote-rates.test.mjs
      - name: Probar complementos opcionales del cotizador
        run: node .github/quote-optionals.test.mjs
      - name: Probar plantilla comercial de correo para cotizaciones
        run: node .github/quote-email.test.mjs
      - name: Validar comparación de precios y descuentos comerciales
        run: node .github/quote-commercial-pricing.test.mjs
      - name: Instalar biblioteca para exportar Word
        run: npm install --no-save docx@9.5.3 jszip@3.10.1
      - name: Validar documento Word real con todas las etapas
        run: node .github/quote-word.test.mjs
