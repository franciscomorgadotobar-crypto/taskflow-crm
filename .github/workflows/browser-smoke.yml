name: CRM Browser Smoke Test

on:
  push:
    branches: [master, feature-duplicate-merge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/taskflow-http.log 2>&1 &
          echo $! > /tmp/taskflow-http.pid

      - name: Run browser smoke test
        run: node .github/smoke-test.mjs
